services:
  postgres:
    image: postgres:16
    container_name: karis-review-postgres
    environment:
      POSTGRES_DB: karis_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - karis-review-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karis_review"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  karis-review-pgdata:
