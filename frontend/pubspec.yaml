name: karisreview
description: "Karis Review - Spaced Repetition Flashcard App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  dio: ^5.7.0
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.3
  flutter_quill: ^11.5.1
  flutter_math_fork: ^0.7.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  file_picker: ^10.3.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  protoc_plugin: ^25.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3

flutter:
  generate: true
  uses-material-design: true
