  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.3
  flutter_quill: ^11.5.1
  flutter_math_fork: ^0.7.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true