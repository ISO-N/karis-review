# OpenAPI 生产环境配置：不对外暴露接口文档
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- 连接池与超时保护（P1-6）----
# 池大小按 CPU 核数 × 2~4 估算（4 核服务器 → 16）；最小空闲 4
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:16}
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# 任何语句最多 30 秒，防止失控查询无限占住连接池
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '30s'
spring.jpa.properties.hibernate.jdbc.timeout=30
