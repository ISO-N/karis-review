# OpenAPI 生产环境配置：不对外暴露接口文档
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- 连接池与超时保护（P1-6）----
# 池大小按 CPU 核数 × 2~4 估算（4 核服务器 → 16）；最小空闲 4
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:16}
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# 任何语句最多 30 秒，防止失控查询无限占住连接池
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '30s'
spring.jpa.properties.hibernate.jdbc.timeout=30

# ---- 可观测性（WP-3）：生产环境暴露指标端点（由网关限制外部访问）----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# JSON 结构化日志（Spring Boot 3.4 原生，Logstash 格式，Loki 可直接解析）
logging.structured.format.console=logstash

# ---- Outbox（WP-4）----
app.outbox.batch-size=100
app.outbox.poll-interval=2000ms
app.outbox.stale-lock-threshold=5m

# ---- 限流（WP-6）----
app.rate-limit.enabled=true
app.rate-limit.auth.per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
app.rate-limit.api.per-minute=${RATE_LIMIT_API_PER_MINUTE:120}

# ---- 备份存储（WP-1/G1）：生产默认 S3/MinIO；单机部署可切 local 并挂独立卷 ----
backup.storage.type=${BACKUP_STORAGE_TYPE:s3}
backup.storage.local-dir=${BACKUP_LOCAL_DIR:/backups}
backup.storage.s3.endpoint=${BACKUP_S3_ENDPOINT:}
backup.storage.s3.access-key=${BACKUP_S3_ACCESS_KEY:}
backup.storage.s3.secret-key=${BACKUP_S3_SECRET_KEY:}
backup.storage.s3.bucket=${BACKUP_S3_BUCKET:karis-review-backups}
backup.storage.s3.prefix=${BACKUP_S3_PREFIX:backups}
