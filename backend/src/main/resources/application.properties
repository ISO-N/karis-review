spring.application.name=karis-review

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/karis_review
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=karis-review-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=604800000

# Server
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=512
server.compression.mime-types=application/json,application/xml,text/plain,text/html,text/css,text/javascript,application/javascript,application/x-protobuf
# Jackson
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC

# OpenAPI（生产环境通过 application-prod.properties 关闭）
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true