spring.application.name=karis-review

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/karis_review
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# JDBC 批处理：批量导入/评分同步合并为批次 INSERT/UPDATE，减少网络往返
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
# 单密钥（兼容旧配置）：jwt.secret
# 多密钥轮换（WP-8）：jwt.active-kid 指定签发密钥；jwt.keys.<kid> 定义全部可验签密钥
jwt.secret=karis-review-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=604800000
jwt.active-kid=${JWT_ACTIVE_KID:legacy}
jwt.keys.legacy=${JWT_SECRET:karis-review-secret-key-must-be-at-least-256-bits-long-for-hs256}

# 可观测性（WP-3）：Actuator 端点
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=karis-review

# Outbox（WP-4）
app.outbox.batch-size=100
app.outbox.poll-interval=2000ms
app.outbox.stale-lock-threshold=5m

# 限流（WP-6）
app.rate-limit.enabled=true
# 认证类接口（注册/登录/发码）：每 IP 每分钟允许次数
app.rate-limit.auth.per-minute=20
# 通用业务接口：每用户每分钟允许次数
app.rate-limit.api.per-minute=120

# 备份存储（WP-1/G1）：local（默认，独立卷）或 s3（MinIO/OSS/COS）
backup.storage.type=${BACKUP_STORAGE_TYPE:local}
backup.storage.local-dir=${BACKUP_LOCAL_DIR:./backups}
backup.storage.s3.endpoint=${BACKUP_S3_ENDPOINT:}
backup.storage.s3.access-key=${BACKUP_S3_ACCESS_KEY:}
backup.storage.s3.secret-key=${BACKUP_S3_SECRET_KEY:}
backup.storage.s3.bucket=${BACKUP_S3_BUCKET:karis-review-backups}
backup.storage.s3.prefix=${BACKUP_S3_PREFIX:backups}

# Auth
auth.invite.enabled=false
auth.invite.code=

# Password reset（找回密码验证码）
auth.reset.code.ttl=15m
auth.reset.max.attempts=10
auth.reset.resend.cooldown=60s
# SMTP（未配置 mail.smtp.host 时走 NoopMailSender，仅打印验证码到日志）
mail.smtp.host=${MAIL_SMTP_HOST:}
mail.smtp.port=${MAIL_SMTP_PORT:587}
mail.smtp.username=${MAIL_SMTP_USERNAME:}
mail.smtp.password=${MAIL_SMTP_PASSWORD:}
mail.smtp.auth=true
mail.smtp.starttls.enable=true
# 走本地 SOCKS5 代理（如 Resend 在中国境内需要代理；留空则直连）
mail.smtp.socks.host=${MAIL_SMTP_SOCKS_HOST:}
mail.smtp.socks.port=${MAIL_SMTP_SOCKS_PORT:}
mail.from=${MAIL_FROM:noreply@kariscode.top}
# Server
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=512
server.compression.mime-types=application/json,application/xml,text/plain,text/html,text/css,text/javascript,application/javascript,application/x-protobuf
# Timezone
app.timezone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=${app.timezone:Asia/Shanghai}

# OpenAPI（生产环境通过 application-prod.properties 关闭）
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# springdoc 2.8.17+ 的 UI 自动配置与 Spring Boot 3.4.0 不兼容，静态资源由 SwaggerUiResourceFix 提供
spring.autoconfigure.exclude=org.springdoc.webmvc.ui.SwaggerConfig