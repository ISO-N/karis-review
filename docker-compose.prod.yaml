name: karis-review-prod

services:
  backend:
    image: ghcr.io/iso-n/karis-review-backend:latest
    container_name: karis-review-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/karis_review
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?请在 .env.prod 中设置 JWT_SECRET}"
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
      AUTH_INVITE_ENABLED: "${AUTH_INVITE_ENABLED:-false}"
      AUTH_INVITE_CODE: "${AUTH_INVITE_CODE:-}"
      MAIL_SMTP_HOST: "${MAIL_SMTP_HOST:-}"
      MAIL_SMTP_PORT: "${MAIL_SMTP_PORT:-587}"
      MAIL_SMTP_USERNAME: "${MAIL_SMTP_USERNAME:-}"
      MAIL_SMTP_PASSWORD: "${MAIL_SMTP_PASSWORD:-}"
      MAIL_SMTP_SOCKS_HOST: "${MAIL_SMTP_SOCKS_HOST:-}"
      MAIL_SMTP_SOCKS_PORT: "${MAIL_SMTP_SOCKS_PORT:-}"
      MAIL_FROM: "${MAIL_FROM:-noreply@kariscode.top}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: karis-review-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: karis_review
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}"
    # 性能参数按 4GB 内存服务器估算；内存不同请等比调整：
    # shared_buffers ≈ 内存 25%、effective_cache_size ≈ 内存 75%
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "autovacuum=on"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.02"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
    # macOS / WSL 下默认 /dev/shm 仅 64MB，可能限制并行查询；Linux 上无副作用
    shm_size: "1gb"
    volumes:
      - karis-review-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d karis_review"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  karis-review-prod-pgdata:
